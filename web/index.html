<!DOCTYPE html>
<!--
  Astrology Nova — deep-sky view.

  The Stellarium Web Engine (AGPL v3, Stellarium Labs SRL / Noctua Software Ltd)
  compiled to WebAssembly, wrapped in Nova's own chrome. This page is deliberately
  dependency-free: it ships inside the APK and has to draw the sky with the phone
  in airplane mode, so there is no Vue, no icon font and no CDN anywhere in it.
  Every asset it loads is a sibling file served by WebViewAssetLoader.

  Licensed under the GNU AGPL v3 with the rest of engine/ and web/.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Astrology Nova</title>

<!-- Without these, "add to home screen" gives you a grey letter tile and a page that
     opens inside the browser chrome. The mark is the same geometry as the APK's
     launcher drawable, exported by tools/export-icons.sh.
     Both PNG icons are declared "maskable" as well as "any": the mark keeps everything
     load-bearing inside the central 61% of the square, which clears Android's 80%
     maskable safe zone, so a launcher may crop it to a circle without cutting the ring. -->
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Astrology Nova">
<style>
  :root {
    --nova-ground: #0b1020;
    --nova-panel: rgba(15, 22, 51, 0.82);
    --nova-edge: rgba(90, 242, 255, 0.22);
    --nova-cyan: #5af2ff;
    --nova-violet: #9b7bff;
    --nova-text: #e6ecff;
    --nova-dim: #9aa3c7;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--nova-ground);
    color: var(--nova-text);
    font: 400 14px/1.45 -apple-system, "Roboto", "Segoe UI", system-ui, sans-serif;
    /* The sky is the only thing that should ever move under a finger. */
    overscroll-behavior: none;
    touch-action: none;
    user-select: none;
  }

  /* The camera feed sits behind the sky. The canvas above it is composited with
     mix-blend-mode: screen, which is what makes this work without touching the
     engine's C: screen leaves the backdrop untouched wherever the sky is black
     and adds stars, lines and labels on top of it. The engine clears every frame
     to opaque black (render_gl.c), so an alpha channel on the canvas would not
     have helped — the black would still have covered the camera. */
  #camera {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
    opacity: 0;
    transition: opacity 0.35s ease;
    pointer-events: none;
  }
  #camera.on { opacity: 1; }
  #sky.over-camera { mix-blend-mode: screen; }

  /* Right-hand control column. Vertical and thumb-height on purpose: these are
     used one-handed with the phone held up at the sky, which is the opposite of
     the bottom toolbar's browse-while-sitting posture. */
  #controls {
    position: fixed;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 3;
  }

  .ctl {
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--nova-edge);
    border-radius: 16px;
    background: var(--nova-panel);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    color: var(--nova-dim);
    cursor: pointer;
    transition: color 0.15s, background 0.15s, border-color 0.15s;
  }
  .ctl svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.7; }
  .ctl.on { color: var(--nova-cyan); background: rgba(90, 242, 255, 0.14); border-color: var(--nova-cyan); }
  .ctl:active { transform: scale(0.94); }
  .ctl[disabled] { opacity: 0.35; pointer-events: none; }

  /* Transient messages: a camera refusal, a saved screenshot, a landscape warning.
     Nothing here is worth a dialog. */
  #toast {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 108px);
    transform: translate(-50%, 8px);
    max-width: min(360px, calc(100vw - 32px));
    padding: 10px 16px;
    border-radius: 12px;
    background: var(--nova-panel);
    border: 1px solid var(--nova-edge);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    font-size: 13px;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 4;
  }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* The shutter flash. Cheap, and it is the only feedback that reads instantly
     as "that was taken" on a screen already full of stars. */
  #flash {
    position: fixed;
    inset: 0;
    background: #e6ecff;
    opacity: 0;
    pointer-events: none;
    z-index: 5;
  }
  #flash.fire { animation: shutter 0.42s ease-out; }
  @keyframes shutter {
    0% { opacity: 0; }
    12% { opacity: 0.82; }
    100% { opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    #flash.fire { animation: none; }
  }

  #sky {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* The chrome floats over the sky, so every panel is a translucent slab with a
     hairline in the brand cyan rather than a solid surface. */
  .slab {
    background: var(--nova-panel);
    border: 1px solid var(--nova-edge);
    border-radius: 14px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  #topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 10px;
    background: linear-gradient(to bottom, rgba(11, 16, 32, 0.9), rgba(11, 16, 32, 0));
    pointer-events: none;
  }

  #wordmark {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  #wordmark b { color: var(--nova-cyan); font-weight: 600; }

  #progress {
    margin-left: auto;
    font-size: 12px;
    color: var(--nova-dim);
    opacity: 0;
    transition: opacity 0.25s;
  }
  #progress.on { opacity: 1; }

  /* Bottom toolbar. Scrolls horizontally rather than wrapping: a second row of
     controls would eat the sky on a short phone. */
  #toolbar {
    position: fixed;
    left: 0; right: 0;
    bottom: 0;
    display: flex;
    gap: 8px;
    padding: 10px 12px calc(env(safe-area-inset-bottom, 0px) + 12px);
    overflow-x: auto;
    scrollbar-width: none;
    background: linear-gradient(to top, rgba(11, 16, 32, 0.92), rgba(11, 16, 32, 0));
  }
  #toolbar::-webkit-scrollbar { display: none; }

  .chip {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    width: 66px;
    padding: 8px 4px 6px;
    border: 1px solid transparent;
    border-radius: 14px;
    background: rgba(20, 28, 60, 0.55);
    color: var(--nova-dim);
    font-size: 10px;
    line-height: 1.15;
    text-align: center;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
  }
  .chip svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; }
  .chip.on {
    color: var(--nova-cyan);
    border-color: var(--nova-edge);
    background: rgba(90, 242, 255, 0.1);
  }
  .chip:active { transform: scale(0.96); }

  /* Selection card: sits above the toolbar, never over it. */
  #info {
    position: fixed;
    left: 12px;
    /* Clears the control column rather than sliding under it on a short screen,
       where the vertically-centred controls reach down into the card. */
    right: 76px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 92px);
    padding: 12px 14px;
    display: none;
  }
  #info.on { display: block; }
  #info h2 {
    margin: 0 0 2px;
    font-size: 17px;
    font-weight: 600;
    color: var(--nova-text);
  }
  #info .sub {
    margin: 0 0 8px;
    font-size: 12px;
    color: var(--nova-violet);
  }
  #info dl {
    margin: 0;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 2px 12px;
    font-size: 12px;
  }
  #info dt { color: var(--nova-dim); }
  #info dd { margin: 0; font-variant-numeric: tabular-nums; }
  #info .close {
    position: absolute;
    top: 8px; right: 10px;
    padding: 4px 8px;
    color: var(--nova-dim);
    font-size: 16px;
    cursor: pointer;
  }

  /* Cold start. The engine takes a moment to bring 1.2 MB of wasm up and read
     the star index off disk; an empty black screen reads as a crash. */
  #boot {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: var(--nova-ground);
    transition: opacity 0.4s;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
  #boot .flare {
    width: 76px; height: 76px;
    animation: pulse 2.4s ease-in-out infinite;
  }
  #boot p { margin: 0; color: var(--nova-dim); font-size: 13px; }
  @keyframes pulse {
    0%, 100% { opacity: 0.55; transform: scale(0.94); }
    50%      { opacity: 1;    transform: scale(1.04); }
  }
  @media (prefers-reduced-motion: reduce) {
    #boot .flare { animation: none; opacity: 1; }
  }
</style>
</head>
<body>

<video id="camera" playsinline webkit-playsinline muted autoplay aria-hidden="true"></video>
<canvas id="sky"></canvas>
<div id="flash"></div>

<div id="topbar">
  <div id="wordmark">Astrology&nbsp;<b>Nova</b></div>
  <div id="progress"></div>
</div>

<div id="info" class="slab">
  <div class="close" id="info-close">×</div>
  <h2 id="info-name"></h2>
  <p class="sub" id="info-type"></p>
  <dl id="info-rows"></dl>
</div>

<div id="controls"></div>

<div id="toolbar"></div>

<div id="toast" role="status" aria-live="polite"></div>

<div id="boot">
  <svg class="flare" viewBox="0 0 108 108" aria-hidden="true">
    <defs>
      <linearGradient id="bootg" x1="30" y1="30" x2="78" y2="78" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#5af2ff"/>
        <stop offset="0.46" stop-color="#eaf6ff"/>
        <stop offset="1" stop-color="#9b7bff"/>
      </linearGradient>
    </defs>
    <ellipse cx="54" cy="54" rx="32" ry="11.5" transform="rotate(-22 54 54)"
             fill="none" stroke="#5af2ff" stroke-opacity="0.55" stroke-width="2.2"/>
    <path d="M54,27 Q60,48 81,54 Q60,60 54,81 Q48,60 27,54 Q48,48 54,27 Z" fill="url(#bootg)"/>
  </svg>
  <p id="boot-msg">Encendiendo el cielo…</p>
</div>

<script src="js/stellarium-web-engine.js"></script>
<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------------------
  // Strings. The Android shell ships 28 locales; this page carries two, because
  // its whole vocabulary is eight toggles and four row labels. Anything else
  // falls back to English rather than showing a key.
  // ---------------------------------------------------------------------------
  var ES = navigator.language && navigator.language.slice(0, 2) === 'es';
  function t(en, es) { return ES ? es : en; }

  var el = function (id) { return document.getElementById(id); };
  var canvas = el('sky');

  // Icons are inline paths on a 24-unit grid, stroked in currentColor so the
  // chip's on/off state tints them for free.
  var ICONS = {
    lines:      'M4 17 L9 7 L15 12 L20 5 M4 17 m-1.4 0 a1.4 1.4 0 1 0 2.8 0 a1.4 1.4 0 1 0 -2.8 0 M9 7 m-1.4 0 a1.4 1.4 0 1 0 2.8 0 a1.4 1.4 0 1 0 -2.8 0 M15 12 m-1.4 0 a1.4 1.4 0 1 0 2.8 0 a1.4 1.4 0 1 0 -2.8 0 M20 5 m-1.4 0 a1.4 1.4 0 1 0 2.8 0 a1.4 1.4 0 1 0 -2.8 0',
    art:        'M7 20 C5 14 7 6 12 3 C17 6 19 14 17 20 Z M12 3 L12 20',
    labels:     'M4 7 h16 M4 12 h11 M4 17 h7',
    atmosphere: 'M3 15 h18 M5 11 h14 M8 7 h8 M12 21 v-2',
    ground:     'M2 16 L8 10 L13 15 L17 11 L22 16 M2 16 h20 v4 h-20 z',
    grid:       'M3 3 h18 v18 h-18 z M9 3 v18 M15 3 v18 M3 9 h18 M3 15 h18',
    dso:        'M12 12 m-4 0 a4 4 0 1 0 8 0 a4 4 0 1 0 -8 0 M12 12 m-8.5 0 a8.5 4.5 0 1 0 17 0 a8.5 4.5 0 1 0 -17 0',
    milkyway:   'M2 18 C7 16 9 10 14 8 C17 6.8 20 6.4 22 6.6 M4 13 m-0.6 0 a0.6 0.6 0 1 0 1.2 0 a0.6 0.6 0 1 0 -1.2 0 M11 11 m-0.6 0 a0.6 0.6 0 1 0 1.2 0 a0.6 0.6 0 1 0 -1.2 0 M18 8 m-0.6 0 a0.6 0.6 0 1 0 1.2 0 a0.6 0.6 0 1 0 -1.2 0'
  };

  // Each toggle names an engine object and one of its boolean properties.
  var TOGGLES = [
    { id: 'lines',      icon: 'lines',      label: t('Lines', 'Líneas'),      path: 'constellations',    attr: 'lines_visible',  on: true },
    { id: 'art',        icon: 'art',        label: t('Art', 'Arte'),          path: 'constellations',    attr: 'images_visible', on: false },
    { id: 'names',      icon: 'labels',     label: t('Names', 'Nombres'),     path: 'constellations',    attr: 'labels_visible', on: true },
    { id: 'dsos',       icon: 'dso',        label: t('Nebulae', 'Nebulosas'), path: 'dsos',              attr: 'visible',        on: true },
    { id: 'milkyway',   icon: 'milkyway',   label: t('Milky Way', 'Vía Láctea'), path: 'milkyway',       attr: 'visible',        on: true },
    { id: 'atmosphere', icon: 'atmosphere', label: t('Air', 'Atmósfera'),     path: 'atmosphere',        attr: 'visible',        on: true },
    { id: 'landscape',  icon: 'ground',     label: t('Ground', 'Suelo'),      path: 'landscapes',        attr: 'visible',        on: true },
    { id: 'grid',       icon: 'grid',       label: t('Grid', 'Cuadrícula'),   path: 'lines.azimuthal',   attr: 'visible',        on: false }
  ];

  var stel = null;

  function resolve(path) {
    return path.split('.').reduce(function (o, k) { return o && o[k]; }, stel.core);
  }

  // ---------------------------------------------------------------------------
  // Toolbar
  // ---------------------------------------------------------------------------
  function buildToolbar() {
    var bar = el('toolbar');
    TOGGLES.forEach(function (spec) {
      var chip = document.createElement('div');
      chip.className = 'chip';
      chip.setAttribute('role', 'switch');
      chip.setAttribute('aria-label', spec.label);
      chip.innerHTML =
        '<svg viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" ' +
        'stroke-linejoin="round" d="' + ICONS[spec.icon] + '"/></svg><span>' +
        spec.label + '</span>';
      chip.addEventListener('click', function () {
        var obj = resolve(spec.path);
        if (!obj) return;
        obj[spec.attr] = !obj[spec.attr];
        syncToolbar();
      });
      spec.node = chip;
      bar.appendChild(chip);
    });
  }

  function syncToolbar() {
    if (!stel) return;
    TOGGLES.forEach(function (spec) {
      var obj = resolve(spec.path);
      var on = !!(obj && obj[spec.attr]);
      spec.node.classList.toggle('on', on);
      spec.node.setAttribute('aria-checked', on ? 'true' : 'false');
    });
  }

  // ---------------------------------------------------------------------------
  // Selection card
  // ---------------------------------------------------------------------------
  function pad(n, width) {
    var s = String(Math.abs(Math.trunc(n)));
    while (s.length < width) s = '0' + s;
    return s;
  }

  function formatRa(angle) {
    var f = stel.a2tf(angle, 1);
    return pad(f.hours, 2) + 'h ' + pad(f.minutes, 2) + 'm ' +
           pad(f.seconds, 2) + '.' + f.fraction + 's';
  }

  function formatDeg(angle) {
    var f = stel.a2af(angle, 1);
    return f.sign + pad(f.degrees, 2) + '° ' + pad(f.arcminutes, 2) + "' " +
           pad(f.arcseconds, 2) + '"';
  }

  function displayName(obj) {
    var names = obj.designations();
    if (!names || !names.length) return t('Unnamed object', 'Objeto sin nombre');
    // Designations come back most-human-readable first, prefixed by catalogue.
    return names[0].replace(/^NAME /, '');
  }

  function updateInfo() {
    var card = el('info');
    var sel = stel.core.selection;
    if (!sel) { card.classList.remove('on'); return; }

    el('info-name').textContent = displayName(sel);

    var others = (sel.designations() || []).slice(1, 4)
      .map(function (d) { return d.replace(/^NAME /, ''); });
    el('info-type').textContent = others.join(' · ');

    var obs = stel.core.observer;
    var cirs = stel.convertFrame(obs, 'ICRF', 'CIRS', sel.getInfo('radec'));
    var radec = stel.c2s(cirs);
    var azalt = stel.c2s(stel.convertFrame(obs, 'CIRS', 'OBSERVED', cirs));
    var vmag = sel.getInfo('vmag');

    var rows = [
      [t('Magnitude', 'Magnitud'), vmag === undefined || isNaN(vmag)
        ? '—' : vmag.toFixed(2)],
      ['RA', formatRa(stel.anp(radec[0]))],
      ['Dec', formatDeg(stel.anpm(radec[1]))],
      [t('Azimuth', 'Azimut'), formatDeg(stel.anp(azalt[0]))],
      [t('Altitude', 'Altura'), formatDeg(stel.anpm(azalt[1]))]
    ];

    el('info-rows').innerHTML = rows.map(function (r) {
      return '<dt>' + r[0] + '</dt><dd>' + r[1] + '</dd>';
    }).join('');
    card.classList.add('on');
  }

  el('info-close').addEventListener('click', function () {
    if (stel) stel.core.selection = null;
    el('info').classList.remove('on');
  });

  // ---------------------------------------------------------------------------
  // Loading progress
  // ---------------------------------------------------------------------------
  function updateProgress() {
    var bars = stel.core.progressbars;
    var node = el('progress');
    if (!bars || !bars.length) { node.classList.remove('on'); return; }
    var bar = bars[0];
    var pct = bar.total ? Math.round(bar.value / bar.total * 100) : 0;
    node.textContent = bar.label + ' ' + pct + '%';
    node.classList.add('on');
  }

  // ---------------------------------------------------------------------------
  // Transient messages. A refused camera, a saved photo, a phone held sideways —
  // none of it is worth a dialog, and a dialog over the sky is worse than useless
  // when you are outside holding the phone up.
  // ---------------------------------------------------------------------------
  var toastTimer = null;
  function toast(message, ms) {
    var node = el('toast');
    node.textContent = message;
    node.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { node.classList.remove('on'); }, ms || 2600);
  }

  // ---------------------------------------------------------------------------
  // Camera. Ported from Astara's camera-service.js (AGPL v3, same licence as this
  // file), trimmed to what this page needs and with the Vue store removed.
  // ---------------------------------------------------------------------------
  var Camera = {
    stream: null,
    active: false,
    video: el('camera'),

    supported: function () {
      return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
    },

    start: function () {
      var self = this;
      if (self.active) return Promise.resolve(true);
      if (!self.supported()) {
        toast(t('This browser has no camera access.', 'Este navegador no da acceso a la cámara.'));
        return Promise.resolve(false);
      }
      // No resolution constraint: asking for one makes Android crop the sensor to
      // match, which narrows the real field of view and puts the drawn sky out of
      // register with what the camera sees.
      return navigator.mediaDevices
        .getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false })
        .then(function (stream) {
          self.stream = stream;
          self.video.srcObject = stream;
          return self.video.play();
        })
        .then(function () {
          self.active = true;
          self.video.classList.add('on');
          return true;
        })
        .catch(function (err) {
          self.stop();
          var denied = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError');
          toast(denied
            ? t('Camera permission refused.', 'Permiso de cámara denegado.')
            : t('No camera available.', 'No hay cámara disponible.'));
          return false;
        });
    },

    stop: function () {
      if (this.stream) {
        this.stream.getTracks().forEach(function (track) { track.stop(); });
        this.stream = null;
      }
      this.video.classList.remove('on');
      this.video.srcObject = null;
      this.active = false;
    }
  };

  // ---------------------------------------------------------------------------
  // Pointing the sky with the phone. Ported from Astara's gyroscope-service.js
  // (AGPL v3): the rotation-matrix derivation and the adaptive smoothing are
  // theirs, and both are the fiddly parts — the W3C device frame, the roll needed
  // to keep the horizon level, and a gain that is heavy enough to kill jitter
  // when still without lagging when you swing the phone across the sky.
  //
  // Removed: their Capacitor screen-orientation lock, which this page cannot use.
  // Kept: the portrait-only restriction, because the maths below assumes the
  // device's -Z axis is the camera and does not compensate for a rotated screen.
  // ---------------------------------------------------------------------------
  var DEG = Math.PI / 180;

  var Gyro = {
    active: false,
    smoothYaw: null,
    smoothPitch: null,
    lastUpdate: 0,
    updateInterval: 16,
    // Exponential adaptive gain: still phone → heavy smoothing, moving phone →
    // light smoothing.
    minFactor: 0.06,
    maxFactor: 0.7,
    k: 4.0,
    d0: 0.02,

    requestPermission: function () {
      // iOS gates the sensor behind a user gesture; everywhere else this is a no-op.
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        return DeviceOrientationEvent.requestPermission()
          .then(function (r) { return r === 'granted'; })
          .catch(function () { return false; });
      }
      return Promise.resolve(true);
    },

    start: function () {
      var self = this;
      if (self.active) return Promise.resolve(true);
      if (window.innerWidth > window.innerHeight) {
        toast(t('Hold the phone upright to point at the sky.',
                'Pon el teléfono vertical para apuntar al cielo.'));
        return Promise.resolve(false);
      }
      return self.requestPermission().then(function (ok) {
        if (!ok) {
          toast(t('Motion sensors refused.', 'Permiso de sensores denegado.'));
          return false;
        }
        self.active = true;
        self.smoothYaw = null;
        self.smoothPitch = null;
        self.handler = self.onOrientation.bind(self);
        // deviceorientationabsolute is the one referenced to true north; plain
        // deviceorientation may be relative to wherever the phone started.
        if ('ondeviceorientationabsolute' in window) {
          window.addEventListener('deviceorientationabsolute', self.handler, true);
        } else {
          window.addEventListener('deviceorientation', self.handler, true);
        }
        self.resizeHandler = function () {
          if (window.innerWidth > window.innerHeight) {
            setControl('compass', false);
            toast(t('Pointing stopped: phone is sideways.',
                    'Apuntado detenido: el teléfono está de lado.'));
          }
        };
        window.addEventListener('resize', self.resizeHandler);
        // Swiping the sky by hand means you want to look somewhere else than
        // where the phone points; the two modes cannot both win.
        self.touchHandler = function (e) {
          if (e.touches.length === 1) {
            setControl('compass', false);
            toast(t('Pointing stopped — you dragged the sky.',
                    'Apuntado detenido: arrastraste el cielo.'));
          }
        };
        canvas.addEventListener('touchmove', self.touchHandler, { passive: true });
        if (stel && stel.core.fov > 60 * DEG) stel.core.fov = 45 * DEG;
        return true;
      });
    },

    stop: function () {
      if (!this.active) return;
      this.active = false;
      window.removeEventListener('deviceorientationabsolute', this.handler, true);
      window.removeEventListener('deviceorientation', this.handler, true);
      window.removeEventListener('resize', this.resizeHandler);
      canvas.removeEventListener('touchmove', this.touchHandler);
      if (stel) stel.core.observer.roll = 0;
    },

    /**
     * Where the back camera points, in world coordinates, plus the roll needed to
     * keep the horizon level. W3C gives R = Rz(alpha)·Rx(beta)·Ry(gamma); the back
     * camera is the device's -Z axis, so it is the third column of R, negated.
     */
    orientationData: function (alpha, beta, gamma) {
      var a = alpha * DEG, b = beta * DEG, g = gamma * DEG;
      var cA = Math.cos(a), sA = Math.sin(a);
      var cB = Math.cos(b), sB = Math.sin(b);
      var cG = Math.cos(g), sG = Math.sin(g);

      var m12 = -sA * cB;
      var m22 = cA * cB;
      var m13 = cA * sG + sA * sB * cG;
      var m23 = sA * sG - cA * sB * cG;
      var m33 = cB * cG;

      var east = -m13, north = -m23, up = -m33;

      // Roll: how far the device's own "up" has rotated around the view axis.
      var horizontal = Math.sqrt(east * east + north * north);
      var roll;
      if (horizontal > 0.01) {
        var rightEast = -north / horizontal;
        var rightNorth = east / horizontal;
        roll = -Math.atan2(m12 * rightEast + m22 * rightNorth, sB);
      } else {
        // Straight up or straight down: the view axis is vertical and "right" is
        // undefined, so gamma is the only thing left that means anything.
        roll = g;
      }
      return { east: east, north: north, up: up, roll: roll };
    },

    smooth: function (next, prev, wraps) {
      if (prev === null) return next;
      var diff = next - prev;
      if (wraps) {
        if (diff > Math.PI) diff -= 2 * Math.PI;
        if (diff < -Math.PI) diff += 2 * Math.PI;
      }
      var absDiff = Math.abs(diff);
      var factor;
      if (absDiff < this.d0) {
        factor = this.minFactor;
      } else {
        var response = 1 - Math.exp(-this.k * (absDiff - this.d0));
        factor = this.minFactor + (this.maxFactor - this.minFactor) * response;
      }
      return prev + factor * diff;
    },

    onOrientation: function (event) {
      if (!this.active || !stel) return;
      var now = Date.now();
      if (now - this.lastUpdate < this.updateInterval) return;
      this.lastUpdate = now;

      var alpha = event.alpha, beta = event.beta, gamma = event.gamma;
      if (alpha === null || beta === null || gamma === null) return;

      // iOS reports a true heading clockwise from north; alpha is counterclockwise.
      if (event.webkitCompassHeading !== undefined && event.webkitCompassHeading !== null) {
        alpha = (360 - event.webkitCompassHeading) % 360;
      }

      var d = this.orientationData(alpha, beta, gamma);

      // W3C world frame is X=East, Y=North, Z=Up; the engine's OBSERVED frame is
      // X=North, Y=East, Z=Up, and yaw is measured from north toward east.
      var yaw = Math.atan2(d.east, d.north);
      var pitch = Math.atan2(d.up, Math.sqrt(d.north * d.north + d.east * d.east));

      this.smoothYaw = this.smooth(yaw, this.smoothYaw, true);
      this.smoothPitch = this.smooth(pitch, this.smoothPitch, false);
      this.smoothPitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, this.smoothPitch));

      try {
        var obs = stel.core.observer;
        obs.yaw = this.smoothYaw;
        obs.pitch = this.smoothPitch;
        obs.roll = d.roll;
      } catch (e) {
        // A frame dropped mid-teardown is not worth breaking the sensor loop over.
      }
    }
  };

  // ---------------------------------------------------------------------------
  // Zoom
  // ---------------------------------------------------------------------------
  var FOV_MIN = 0.6 * DEG;
  var FOV_MAX = 120 * DEG;

  function zoomBy(factor) {
    if (!stel) return;
    stel.core.fov = Math.max(FOV_MIN, Math.min(FOV_MAX, stel.core.fov * factor));
    syncControls();
  }

  // ---------------------------------------------------------------------------
  // Capture. Composites what you are actually looking at — camera frame first,
  // then the sky screened over it, exactly as the CSS does live — rather than
  // saving one layer and calling it a photo.
  //
  // Reading the canvas back requires preserveDrawingBuffer, which this page asks
  // the engine for at startup; without it the drawing buffer is already cleared
  // by the time we get here and the sky comes out blank.
  // ---------------------------------------------------------------------------
  function capture() {
    if (!stel) return;
    var out = document.createElement('canvas');
    out.width = canvas.width;
    out.height = canvas.height;
    var ctx = out.getContext('2d');

    if (Camera.active && Camera.video.videoWidth) {
      // object-fit: cover, by hand — the same crop the live view shows.
      var vw = Camera.video.videoWidth, vh = Camera.video.videoHeight;
      var scale = Math.max(out.width / vw, out.height / vh);
      var dw = vw * scale, dh = vh * scale;
      ctx.drawImage(Camera.video, (out.width - dw) / 2, (out.height - dh) / 2, dw, dh);
      ctx.globalCompositeOperation = 'screen';
    } else {
      ctx.fillStyle = '#0b1020';
      ctx.fillRect(0, 0, out.width, out.height);
    }
    ctx.drawImage(canvas, 0, 0, out.width, out.height);

    var flash = el('flash');
    flash.classList.remove('fire');
    void flash.offsetWidth;
    flash.classList.add('fire');

    var name = 'astrology-nova-' + new Date().toISOString().replace(/[:.]/g, '-') + '.jpg';
    var dataUrl = out.toDataURL('image/jpeg', 0.92);

    // Inside the app the native side writes it to the gallery: a WebView ignores
    // <a download>, and on Android 10+ MediaStore needs no storage permission.
    if (window.NovaHost && window.NovaHost.saveImage) {
      window.NovaHost.saveImage(dataUrl, name);
      return;
    }
    var link = document.createElement('a');
    link.download = name;
    link.href = dataUrl;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    toast(t('Saved.', 'Guardada.'));
  }

  // Called from the native side once it knows whether the write worked.
  function onImageSaved(ok) {
    toast(ok
      ? t('Saved to your gallery.', 'Guardada en tu galería.')
      : t('Could not save the picture.', 'No se pudo guardar la imagen.'));
  }

  // ---------------------------------------------------------------------------
  // The control column
  // ---------------------------------------------------------------------------
  var CTL_ICONS = {
    camera: 'M4 8h2.9l1.7-2.3h6.8L17.1 8H20a1.7 1.7 0 0 1 1.7 1.7v8.6A1.7 1.7 0 0 1 20 20H4a1.7 1.7 0 0 1-1.7-1.7V9.7A1.7 1.7 0 0 1 4 8z M12 10.2a3.6 3.6 0 1 0 0 7.2 3.6 3.6 0 0 0 0-7.2z',
    compass: 'M12 3.4a8.6 8.6 0 1 0 0 17.2 8.6 8.6 0 0 0 0-17.2z M15.6 8.4 13.2 13.2 8.4 15.6 10.8 10.8 Z',
    plus: 'M12 5.4v13.2 M5.4 12h13.2',
    minus: 'M5.4 12h13.2',
    shutter: 'M12 3.3a8.7 8.7 0 1 0 0 17.4 8.7 8.7 0 0 0 0-17.4z M12 6.7a5.3 5.3 0 1 0 0 10.6 5.3 5.3 0 0 0 0-10.6z'
  };

  var CONTROLS = [
    { id: 'camera',  icon: 'camera',  toggle: true,  label: t('Camera', 'Cámara') },
    { id: 'compass', icon: 'compass', toggle: true,  label: t('Point at the sky', 'Apuntar al cielo') },
    { id: 'zoomin',  icon: 'plus',    toggle: false, label: t('Zoom in', 'Acercar') },
    { id: 'zoomout', icon: 'minus',   toggle: false, label: t('Zoom out', 'Alejar') },
    { id: 'shot',    icon: 'shutter', toggle: false, label: t('Take a picture', 'Tomar una captura') }
  ];

  // What the sky looked like before the camera came on, so turning it off puts
  // things back rather than leaving the user with a stripped view.
  var beforeCamera = null;

  function setControl(id, value) {
    if (id === 'camera') {
      if (value) {
        Camera.start().then(function (ok) {
          if (!ok) { syncControls(); return; }
          // The atmosphere and the ground are painted, opaque, and drawn over
          // exactly what the camera is showing. They have to go, or AR mode is a
          // picture of a simulated sky sitting on a picture of a real one.
          beforeCamera = {
            atmosphere: stel.core.atmosphere.visible,
            landscapes: stel.core.landscapes.visible
          };
          stel.core.atmosphere.visible = false;
          stel.core.landscapes.visible = false;
          canvas.classList.add('over-camera');
          syncControls();
          // Pointing is the whole reason to open the camera.
          if (!Gyro.active) setControl('compass', true);
        });
        return;
      }
      Camera.stop();
      canvas.classList.remove('over-camera');
      if (beforeCamera && stel) {
        stel.core.atmosphere.visible = beforeCamera.atmosphere;
        stel.core.landscapes.visible = beforeCamera.landscapes;
        beforeCamera = null;
      }
      syncControls();
      return;
    }

    if (id === 'compass') {
      if (value) {
        Gyro.start().then(syncControls);
      } else {
        Gyro.stop();
        syncControls();
      }
    }
  }

  function buildControls() {
    var host = el('controls');
    CONTROLS.forEach(function (spec) {
      var node = document.createElement('div');
      node.className = 'ctl';
      node.setAttribute('role', spec.toggle ? 'switch' : 'button');
      node.setAttribute('aria-label', spec.label);
      node.setAttribute('title', spec.label);
      node.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path ' +
        'stroke-linecap="round" stroke-linejoin="round" d="' + CTL_ICONS[spec.icon] + '"/></svg>';
      node.addEventListener('click', function () {
        if (spec.id === 'zoomin') return zoomBy(1 / 1.35);
        if (spec.id === 'zoomout') return zoomBy(1.35);
        if (spec.id === 'shot') return capture();
        setControl(spec.id, !stateOf(spec.id));
      });
      spec.node = node;
      host.appendChild(node);
    });
  }

  function stateOf(id) {
    if (id === 'camera') return Camera.active;
    if (id === 'compass') return Gyro.active;
    return false;
  }

  function syncControls() {
    CONTROLS.forEach(function (spec) {
      if (spec.toggle) {
        var on = stateOf(spec.id);
        spec.node.classList.toggle('on', on);
        spec.node.setAttribute('aria-checked', on ? 'true' : 'false');
      }
      // toggleAttribute, not .disabled: these are divs, and a div has no disabled
      // property — the CSS rule matches the attribute, so setting the property
      // would have left the zoom buttons looking live at both limits.
      if (spec.id === 'zoomin') {
        spec.node.toggleAttribute('disabled', !!stel && stel.core.fov <= FOV_MIN * 1.001);
      }
      if (spec.id === 'zoomout') {
        spec.node.toggleAttribute('disabled', !!stel && stel.core.fov >= FOV_MAX * 0.999);
      }
    });
  }

  // ---------------------------------------------------------------------------
  // Bridge to the Android shell. MainActivity pushes the observer's position and
  // the clock in; the page never asks the browser for geolocation, so the WebView
  // needs no permission of its own and the two views agree on where you are.
  // ---------------------------------------------------------------------------
  var UNIX_EPOCH_MJD = 40587.0;

  window.NovaSky = {
    ready: false,

    setObserver: function (lat, lon, elevationM) {
      if (!stel) return;
      var obs = stel.core.observer;
      obs.latitude = lat * Math.PI / 180;
      obs.longitude = lon * Math.PI / 180;
      obs.elevation = elevationM || 0;
    },

    // Wall-clock milliseconds since the Unix epoch, as MJD for the engine.
    setTime: function (unixMillis) {
      if (!stel) return;
      stel.core.observer.utc = unixMillis / 86400000.0 + UNIX_EPOCH_MJD;
    },

    // Real time again, after time travel.
    resumeNow: function () {
      if (!stel) return;
      stel.core.time_speed = 1;
      window.NovaSky.setTime(Date.now());
    },

    // Point the view at an azimuth/altitude in degrees — used by the Android
    // side when the user picks an object in the native search.
    lookAt: function (azDeg, altDeg, fovDeg) {
      if (!stel) return;
      var pos = stel.s2c(azDeg * Math.PI / 180, altDeg * Math.PI / 180);
      stel.core.lookat(stel.convertFrame(stel.core.observer, 'OBSERVED', 'ICRF', pos), 1.0);
      if (fovDeg) stel.core.fov = fovDeg * Math.PI / 180;
    },

    // Called by the Android shell after it has written a capture to the gallery.
    imageSaved: function (ok) { onImageSaved(!!ok); },

    // The shell calls this once the user has answered the camera permission
    // dialog, so the toggle can retry without the user pressing it twice.
    cameraPermissionResult: function (granted) {
      if (granted) {
        setControl('camera', true);
      } else {
        syncControls();
        toast(t('Camera permission refused.', 'Permiso de cámara denegado.'));
      }
    },

    setToggle: function (id, value) {
      var spec = TOGGLES.filter(function (s) { return s.id === id; })[0];
      if (!spec || !stel) return;
      var obj = resolve(spec.path);
      if (obj) { obj[spec.attr] = !!value; syncToolbar(); }
    }
  };

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && Camera.active) {
      setControl('camera', false);
      toast(t('Camera released.', 'Cámara liberada.'));
    }
  });

  // ---------------------------------------------------------------------------
  // Boot
  // ---------------------------------------------------------------------------
  buildToolbar();
  buildControls();

  StelWebEngine({
    wasmFile: 'js/stellarium-web-engine.wasm',
    canvas: canvas,
    // Asked for by capture(): without it the browser clears the drawing buffer
    // after compositing each frame and a screenshot of the sky comes out empty.
    preserveDrawingBuffer: true,
    translateFn: function (domain, str) { return str; },

    onReady: function (engine) {
      stel = engine;
      var core = stel.core;
      var d = 'skydata/';

      core.stars.addDataSource({ url: d + 'stars' });
      core.skycultures.addDataSource({ url: d + 'skycultures/western', key: 'western' });
      core.dsos.addDataSource({ url: d + 'dso' });
      core.landscapes.addDataSource({ url: d + 'landscapes/guereins', key: 'guereins' });
      core.landscapes.addDataSource({ key: 'zero' });
      core.milkyway.addDataSource({ url: d + 'surveys/milkyway' });
      core.minor_planets.addDataSource({ url: d + 'mpcorb.dat', key: 'mpc_asteroids' });
      ['sun', 'moon', 'mercury', 'venus', 'mars', 'jupiter', 'saturn', 'uranus', 'neptune']
        .forEach(function (body) {
          core.planets.addDataSource({ url: d + 'surveys/sso/' + body, key: body });
        });
      core.comets.addDataSource({ url: d + 'CometEls.txt', key: 'mpc_comets' });
      core.satellites.addDataSource({ url: d + 'tle_satellite.dat', key: 'jsonl/sat' });

      stel.setFont('regular', 'fonts/Roboto-Regular.ttf', 1.38);
      stel.setFont('bold', 'fonts/Roboto-Bold.ttf', 1.38);

      // Defaults: constellation lines and names on, art off. Art is gorgeous and
      // it is also the fastest way to lose the actual stars behind it, so it is
      // opt-in — the app is for finding things in the sky first.
      TOGGLES.forEach(function (spec) {
        var obj = resolve(spec.path);
        if (obj) obj[spec.attr] = spec.on;
      });

      // Until the shell sends a fix, show the sky from wherever the clock says
      // it is at 0°/0° — wrong, but a moving sky beats a blank one, and
      // setObserver overwrites it within a frame or two of the view opening.
      window.NovaSky.setTime(Date.now());
      core.fov = 90 * Math.PI / 180;

      // One callback for every engine-side change; cheap enough to just resync
      // the whole chrome, which is a toolbar and one card.
      stel.change(function (obj, attr) {
        if (attr === 'hovered') return;
        syncToolbar();
        syncControls();
        updateInfo();
        updateProgress();
      });

      syncToolbar();
      syncControls();
      window.NovaSky.ready = true;
      if (window.NovaHost && window.NovaHost.onSkyReady) window.NovaHost.onSkyReady();

      var boot = el('boot');
      boot.classList.add('gone');
      setTimeout(function () { boot.style.display = 'none'; }, 420);
    }
  });
})();
</script>
</body>
</html>
